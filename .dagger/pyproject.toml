[project]
name = "qopenbb"
version = "0.1.0"
description = "QOpenBB image module SDK foundation"
requires-python = "==3.13.*"
dependencies = ["dagger-io==0.21.8"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qopenbb"]

[tool.uv]
required-version = "==0.12.5"
