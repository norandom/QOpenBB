# SPEC PROPOSAL ONLY: images, routing and auth are not implemented/verified yet.
# Run from deployment root with --project-directory . for relative bind mounts.
# User manages Cloudflare Access/cloudflared; all origin traffic is plain HTTP.
name: openbb-self-service
services:
  workspace:
    image: ${WORKSPACE_IMAGE:?Set the verified Full Workspace image digest}
    restart: unless-stopped
    ports:
      - "0.0.0.0:23003:3000"
    environment:
      FRONTENDURL: ${PUBLIC_URL:-https://qbb.hanse-hedge.fund}
      PROURL: ${PUBLIC_URL:-https://qbb.hanse-hedge.fund}
      SELFURL: ${PUBLIC_URL:-https://qbb.hanse-hedge.fund}/api
    volumes:
      - type: bind
        source: ./data/workspace
        target: /data
    # Full image from our fork; adapt existing nginx for /data/*, /agent/*,
    # and /excel/* while retaining /api/* for the Workspace application API.
    # Optional Excel upstream DNS must not block startup before it is enabled.
  data-api:
    image: ${DATA_API_IMAGE:?Set the verified data API image digest}
    restart: unless-stopped
    command: ["openbb-api", "--host", "0.0.0.0", "--port", "6900"]
    expose: ["6900"]
    environment:
      FMP_API_KEY: ${FMP_API_KEY:?Supply FMP_API_KEY in the ignored .env}
      FRED_API_KEY: ${FRED_API_KEY:?Supply FRED_API_KEY in the ignored .env}
    # Latest validated API, FMP adaptation, FRED; prefix/schema/auth checks pending.
  agent:
    image: ${AGENT_IMAGE:?Set the verified Anthropic agent image digest}
    restart: unless-stopped
    expose: ["7777"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Supply ANTHROPIC_API_KEY in the ignored .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:?Select and verify the Anthropic model}
    # Contract: agent discovery + streaming queries on 7777. Model pending.
    # Acceptance against real dashboard data precedes Excel implementation.
  excel:
    profiles: ["excel"]
    image: ${EXCEL_IMAGE:-example.invalid/qopenbb/excel:not-configured}
    restart: unless-stopped
    expose: ["80"]
    # Assets/manifest built for PUBLIC_URL/excel/. HTTPS is supplied by Cloudflare.
    # Office runtime Access authentication remains an integration check.
    # Inactive profile must not require an Excel artifact. Before enabling,
    # deployment validation must require a real immutable EXCEL_IMAGE reference.
