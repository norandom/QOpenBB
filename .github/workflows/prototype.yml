name: Prototype candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_images:
        description: Build candidate images (does not publish or promote)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.5'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Restore protected Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qopenbb-tools"
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.25/safe-chain-linuxstatic-x64 -o "$RUNNER_TEMP/qopenbb-tools/safe-chain"
          echo "3462a8395f822b392b7c0808c70116ef90e17a5a1479e604cfc41d57bfbd827c  $RUNNER_TEMP/qopenbb-tools/safe-chain" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/qopenbb-tools/safe-chain"
          export PATH="$RUNNER_TEMP/qopenbb-tools:$PATH"
          export SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=48
          uv python install 3.13.15
          safe-chain uv safe-chain-verify
          safe-chain uv sync --project pipeline --locked --python 3.13.15
          safe-chain uv sync --project .dagger --locked --python 3.13.15
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.32.1/pnpm-linux-x64 -o "$RUNNER_TEMP/qopenbb-tools/pnpm"
          echo "c5607a86bfb948297e96b393a53c90107766fe56329e62967b1f239d861d4363  $RUNNER_TEMP/qopenbb-tools/pnpm" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/qopenbb-tools/pnpm"
          safe-chain pnpm --dir verification install --frozen-lockfile
      - name: Acquire pinned sources for maintained-scope verification
        run: |
          pipeline/.venv/bin/python -m qopenbb_ci.image_cli acquire --lock sources.lock.json --destination vendor
          test ! -e vendor/data-api
          mv vendor/data_api vendor/data-api
      - name: Focused portable checks
        run: bash pipeline/ci.sh check
      - name: Install pinned Dagger CLI
        if: github.event_name == 'workflow_dispatch' && inputs.build_images
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/dagger/dagger/releases/download/v0.21.8/dagger_v0.21.8_linux_amd64.tar.gz -o "$RUNNER_TEMP/dagger.tar.gz"
          echo "53e226c7da8fb75171e58c35759d736d961ce8b3a12db0baa7b7107954fccc5a  $RUNNER_TEMP/dagger.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dagger.tar.gz" -C "$RUNNER_TEMP/qopenbb-tools" dagger
          echo "$RUNNER_TEMP/qopenbb-tools" >> "$GITHUB_PATH"
      - name: Build candidate images through Dagger
        if: github.event_name == 'workflow_dispatch' && inputs.build_images
        run: bash pipeline/ci.sh build --output artifacts/ci-candidate --release-version prototype-${{ github.run_id }}-${{ github.run_attempt }}
      # Publication remains closed until candidate-image E2E and recovery gates join.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_images
        with:
          name: candidate-reports
          path: artifacts/ci-candidate/**/*.json
          if-no-files-found: warn
