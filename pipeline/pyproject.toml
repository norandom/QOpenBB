[project]
name = "qopenbb-ci"
version = "0.1.0"
description = "Portable QOpenBB delivery command foundation"
requires-python = "==3.13.*"
dependencies = []

[project.scripts]
qopenbb-ci = "qopenbb_ci.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qopenbb_ci"]

[tool.pytest.ini_options]
addopts = "-n0 --maxprocesses=2 --strict-markers"

[tool.uv]
required-version = "==0.12.5"
