[project]
name = "qopenbb-data-runtime"
version = "0.1.0"
requires-python = "==3.13.15"
dependencies = [
  "openbb-core==2.0.1",
  "openbb-equity==2.0.0",
  "openbb-economy==2.0.0",
  "openbb-fred==2.0.0",
  "openbb-fmp==1.6.1+qopenbb.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "pluggy==1.6.0",
]

[tool.uv]
required-version = "==0.12.5"
exclude-newer = "2026-10-14T00:00:00Z"
build-constraint-dependencies = ["hatchling==1.32.4"]

[tool.uv.sources]
openbb-core = { path = "../../vendor/data-api/openbb_platform/core" }
openbb-equity = { path = "../../vendor/data-api/openbb_platform/extensions/equity" }
openbb-economy = { path = "../../vendor/data-api/openbb_platform/extensions/economy" }
openbb-fred = { path = "../../vendor/data-api/openbb_platform/providers/fred" }
openbb-fmp = { path = "../../vendor/data-api/openbb_platform/providers/fmp" }

[tool.pytest.ini_options]
addopts = "-n0 --maxprocesses=2 --strict-markers"
